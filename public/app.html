/* ================= 66-day challenge ================= */

function renderChallenge(main, dom){
  const open = state.challenges.filter(c=>!c.closed);
  const today = todayISO();
  let html = '<section class="wide">'
    + '<div class="tool-card" style="margin-bottom:16px"><h2>The 66-day challenge</h2>'
    + '<p class="why">On average it takes 66 days for a behavior to become automatic. Do the ONE habit in your time block every day and mark the day. If you slip, leave the miss honest and keep going &mdash; the average survives a missed day; quitting doesn&rsquo;t.</p>'
    + '<button class="btn brand" id="chNew">+ Start a 66-day challenge</button>'
    + '<span class="statline" style="margin-left:10px">Marking today&rsquo;s ONE Thing done on the Goal Chain auto-checks today here (same goal line).</span>'
    + '</div>';

  if (!open.length) html += '<p class="empty-note">No challenge running.</p>';

  for (const c of open){
    const cdom = state.domains.find(d=>d.id===c.domainId);
    const count = Object.keys(c.marks).length;
    const dayN = Math.min(66, dayOffset(c.start, today)+1);
    const end = addDaysISO(c.start, 65);
    let streak = 0, cur = c.marks[today] ? today : addDaysISO(today,-1);
    while (c.marks[cur]){ streak++; cur = addDaysISO(cur,-1); }
    let cells = "";
    for (let i=0;i<66;i++){
      const d = addDaysISO(c.start,i);
      const cls = "cell"+(c.marks[d]?" done":"")+(d===today?" today":"")+(d>today?" future":"");
      cells += '<div class="'+cls+'" data-ch="'+c.id+'" data-date="'+d+'" title="Day '+(i+1)+' — '+fmtDate(d)+'">'+(i+1)+'</div>';
    }
    html += '<div class="tool-card" style="margin-bottom:16px">'
      + '<div class="ch-head"><span class="habit">'+esc(c.habit)+'</span>'
      + '<span class="chip unset">'+esc(cdom?cdom.name:"(archived line)")+'</span>'
      + '<span class="statline" style="margin:0">started '+fmtDate(c.start)+' &middot; ends '+fmtDate(end)+'</span></div>'
      + '<div class="c66">'+cells+'</div>'
      + '<div class="statline">'+(today<c.start?'starts '+fmtDate(c.start):'day <b>'+dayN+'</b> of 66')
      + ' &middot; <b>'+count+'</b> marked &middot; current streak <b>'+streak+'</b></div>'
      + (count>=66 ? '<div class="ch-done-banner">66 of 66 &mdash; the habit is yours. Keep the block; pick the next ONE Thing to make automatic.</div>' : '')
      + '<p style="margin:10px 0 0"><button class="btn" data-chclose="'+c.id+'">Archive challenge</button></p>'
      + '</div>';
  }
  html += '</section>';
  main.innerHTML = html;

  $("#chNew").onclick = ()=> askName("New 66-day challenge — the daily habit",
    "Do my ONE Thing in my time block", habit=>{
      state.challenges.push({ id:"c"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
        domainId:dom.id, habit, start:todayISO(), marks:{}, closed:false });
      save(); render();
    });
  main.querySelectorAll(".cell").forEach(el=>{
    const d = el.dataset.date;
    if (d > today) return;
    el.onclick = ()=>{
      const c = state.challenges.find(x=>x.id===el.dataset.ch);
      if (!c) return;
      if (c.marks[d]) delete c.marks[d]; else c.marks[d] = true;
      save(); render();
    };
  });
  main.querySelectorAll("[data-chclose]").forEach(b=>{
    b.onclick = ()=> askConfirm("Archive challenge",
      "Archive this challenge? Its marks stay in the data; it just leaves the screen.",
      ()=>{ const c = state.challenges.find(x=>x.id===b.dataset.chclose); if (c){ c.closed = true; save(); render(); } });
  });
}

/* ================= success list ================= */

function renderList(main, dom){
  const sl = state.successList;
  const alive = sl.items.filter(i=>i.alive);
  let html = '<section class="wide"><div class="tool-card">'
    + '<h2>Success list &mdash; not a to-do list</h2>'
    + '<p class="why">A to-do list is everything that could be done; a success list is the shortest path to what must be done. Dump the list, then apply 80/20 again and again until one item is left standing.</p>';

  if (!sl.distilling){
    html += '<label>Add items (one per line)</label>'
      + '<textarea class="ctl" id="slAdd" rows="3" placeholder="Everything competing for your attention — paste the whole mess"></textarea>'
      + '<p style="margin:8px 0 14px"><button class="btn" id="slAddBtn">Add</button></p>';
    if (alive.length){
      html += alive.map(i=>'<div class="sl-item"><span>'+esc(i.text)+'</span>'
        + '<button class="x" data-slx="'+i.id+'" title="Remove">&times;</button></div>').join("");
      html += '<p style="margin:14px 0 0"><button class="btn brand" id="slGo"'+(alive.length<2?" disabled":"")+'>Distill to the ONE &#8594;</button>'
        + (alive.length<2?' <span class="statline">Need at least two items.</span>':"")+'</p>';
    } else {
      html += '<p class="empty-note">Empty. Add what&rsquo;s competing for your attention.</p>';
    }
  } else if (alive.length > 1){
    const keep = Math.max(1, Math.round(alive.length*0.2));
    html += '<div class="sl-round"><b>Round '+sl.round+'</b> &mdash; of these '+alive.length+', check the vital few (about '+keep+') that matter most, then Next. Repeat until one is left.</div>'
      + alive.map(i=>'<div class="sl-item"><input type="checkbox" data-slk="'+i.id+'"><span>'+esc(i.text)+'</span></div>').join("")
      + '<p style="margin:14px 0 0"><button class="btn brand" id="slNext">Next round &#8594;</button> '
      + '<button class="btn" id="slStop">Stop distilling</button></p>';
  } else {
    const one = alive[0];
    html += '<div class="sl-one"><div style="color:#e8c065;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase">The ONE</div>'
      + '<div class="t">'+esc(one?one.text:"")+'</div>'
      + '<div class="acts">'
      + '<button class="btn good" id="slToDay">Make it Today&rsquo;s ONE Thing</button>'
      + '<button class="btn" id="slToWeek" style="color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)">Make it This Week&rsquo;s</button>'
      + '<button class="btn" id="slReset" style="color:#fff;background:none;border-color:rgba(255,255,255,.4)">Start a new list</button>'
      + '</div></div>';
  }
  html += '</div></section>';
  main.innerHTML = html;

  const addBtn = $("#slAddBtn");
  if (addBtn) addBtn.onclick = ()=>{
    const lines = $("#slAdd").value.split("\n").map(s=>s.trim()).filter(Boolean);
    for (const t of lines) sl.items.push({ id:"i"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36), text:t, alive:true });
    if (lines.length){ save(); render(); }
  };
  main.querySelectorAll("[data-slx]").forEach(b=>{
    b.onclick = ()=>{ sl.items = sl.items.filter(i=>i.id!==b.dataset.slx); save(); render(); };
  });
  const go = $("#slGo");
  if (go) go.onclick = ()=>{ sl.distilling = true; sl.round = 1; save(); render(); };
  const next = $("#slNext");
  if (next) next.onclick = ()=>{
    const kept = [...main.querySelectorAll("[data-slk]:checked")].map(c=>c.dataset.slk);
    if (!kept.length){ $(".sl-round").innerHTML = "<b>Pick at least one.</b> Check the few that matter most, then Next."; return; }
    if (kept.length >= alive.length){ $(".sl-round").innerHTML = "<b>It has to shrink.</b> Leave at least one unchecked &mdash; the point is to cut."; return; }
    for (const i of sl.items) if (i.alive && !kept.includes(i.id)) i.alive = false;
    sl.round++;
    save(); render();
  };
  const stop = $("#slStop");
  if (stop) stop.onclick = ()=>{ sl.distilling = false; sl.items.forEach(i=>i.alive = true); save(); render(); };
  function resetList(){ sl.items = []; sl.distilling = false; sl.round = 0; }
  const promote = (level)=>{
    const one = sl.items.filter(i=>i.alive)[0];
    if (!one) return;
    setLevelText(dom, level, one.text);
    resetList();
    state.view = "chain";
    save(); render();
  };
  const toDay = $("#slToDay");
  if (toDay) toDay.onclick = ()=> promote("day");
  const toWeek = $("#slToWeek");
  if (toWeek) toWeek.onclick = ()=> promote("week");
  const rst = $("#slReset");
  if (rst) rst.onclick = ()=>{ resetList(); save(); render(); };
}

/* ================= weekly planning hour ================= */

const wk = $("#wk");
const WK_STEPS = 5;
let wkIx = 0, wkVals = null;

function openWeeklyHour(){
  const dom = activeDomain(); if (!dom) return;
  wkIx = 0;
  wkVals = { month: dom.levels.month.text, week: dom.levels.week.text,
    blocked:false, thieves:{ no:"", chaos:"", health:"", env:"" } };
  wkPaint();
  wk.showModal();
}

function wkPaint(){
  const dom = activeDomain();
  const body = $("#wkBody");
  $("#wkStep").textContent = "Step "+(wkIx+1)+" of "+WK_STEPS;
  if (wkIx===0){
    const parts = sentenceParts(dom);
    body.innerHTML = '<div class="wk-lbl">Connect &mdash; read your chain aloud</div>'
      + '<div class="wk-sentence">'+(parts.length
          ? parts.map(p=>'<b>'+esc(p.lead)+'</b> '+esc(p.text)).join(" ")
          : '<i>No chain yet &mdash; run &ldquo;Work backward&rdquo; on the Goal Chain first.</i>')+'</div>'
      + '<p class="statline">This is the point of the hour: today has to connect to all your tomorrows.</p>';
  } else if (wkIx===1){
    body.innerHTML = '<div class="wk-lbl">Review the month</div>'
      + '<p class="wz-q" style="font-size:14.5px">Based on my one-year goal, what&rsquo;s the ONE Thing I can do this month?</p>'
      + '<textarea id="wkMonth">'+esc(wkVals.month)+'</textarea>';
  } else if (wkIx===2){
    body.innerHTML = '<div class="wk-lbl">Set the week</div>'
      + '<p class="wz-q" style="font-size:14.5px">Based on my monthly goal, what&rsquo;s the ONE Thing I can do this week?</p>'
      + '<textarea id="wkWeek">'+esc(wkVals.week)+'</textarea>';
  } else if (wkIx===3){
    body.innerHTML = '<div class="wk-lbl">Guard the block</div>'
      + '<p class="statline" style="margin:0 0 8px">Your ONE Thing block is <b>'+esc(state.blocks.oneThingStart)+'&ndash;'+esc(blockEnd())+'</b>; planning hour '
      + WEEKDAYS[state.blocks.planningDay]+' at '+esc(state.blocks.planningStart)+'. Adjust these on the Time Blocking view.</p>'
      + '<label class="chk"><input type="checkbox" id="wkBlocked"'+(wkVals.blocked?" checked":"")+'> My ONE Thing block is on the calendar for every workday this week, and my time off is blocked first.</label>';
  } else {
    const t = wkVals.thieves;
    body.innerHTML = '<div class="wk-lbl">Audit the four thieves</div>'
      + '<label style="font-size:12.5px;font-weight:600;color:var(--muted)">1 &middot; Saying yes when I should say no &mdash; what will I say <b>no</b> to this week?</label>'
      + '<input type="text" class="ctl" id="wkNo" value="'+esc(t.no)+'">'
      + '<label style="font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px;display:block">2 &middot; Fear of chaos &mdash; what mess will I deliberately let sit?</label>'
      + '<input type="text" class="ctl" id="wkChaos" value="'+esc(t.chaos)+'">'
      + '<label style="font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px;display:block">3 &middot; Health &mdash; how will I guard sleep, food and movement?</label>'
      + '<input type="text" class="ctl" id="wkHealth" value="'+esc(t.health)+'">'
      + '<label style="font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px;display:block">4 &middot; Environment &mdash; who or what could pull me off the block, and what&rsquo;s the counter?</label>'
      + '<input type="text" class="ctl" id="wkEnv" value="'+esc(t.env)+'">';
  }
  $("#wkBack").style.visibility = wkIx===0 ? "hidden" : "visible";
  $("#wkNext").textContent = wkIx===WK_STEPS-1 ? "Finish ✓" : "Next →";
}

function wkCollect(){
  if (wkIx===1){ const el = $("#wkMonth"); if (el) wkVals.month = el.value; }
  if (wkIx===2){ const el = $("#wkWeek"); if (el) wkVals.week = el.value; }
  if (wkIx===3){ const el = $("#wkBlocked"); if (el) wkVals.blocked = el.checked; }
  if (wkIx===4){
    wkVals.thieves = { no:$("#wkNo").value.trim(), chaos:$("#wkChaos").value.trim(),
      health:$("#wkHealth").value.trim(), env:$("#wkEnv").value.trim() };
  }
}
$("#wkBack").onclick = ()=>{ wkCollect(); if (wkIx>0){ wkIx--; wkPaint(); } };
$("#wkNext").onclick = ()=>{
  wkCollect();
  if (wkIx < WK_STEPS-1){ wkIx++; wkPaint(); return; }
  const dom = activeDomain();
  setLevelText(dom, "month", wkVals.month);
  setLevelText(dom, "week", wkVals.week);
  state.reviews.unshift({ ts:new Date().toISOString(), weekStart:weekStartISO(),
    domainId:dom.id, blocked:wkVals.blocked, thieves:wkVals.thieves });
  // mirror into the 4-1-1 sheet — fills only rows that are still empty
  ensureDomainTools(dom);
  const ws = weekStartISO();
  const wkSheet = dom.f411.months[ws.slice(0,7)] || (dom.f411.months[ws.slice(0,7)] = { month:"", weeks:{} });
  const wkRow = wkSheet.weeks[ws] || (wkSheet.weeks[ws] = { text:"", done:false });
  if (!wkRow.text.trim() && wkVals.week.trim()) wkRow.text = wkVals.week.trim();
  const moSheet = dom.f411.months[todayISO().slice(0,7)] || (dom.f411.months[todayISO().slice(0,7)] = { month:"", weeks:{} });
  if (!moSheet.month.trim() && wkVals.month.trim()) moSheet.month = wkVals.month.trim();
  if (!dom.f411.annual.trim() && chainHasYear(dom) && dom.levels.year.text.trim()) dom.f411.annual = dom.levels.year.text.trim();
  save();
  wk.close();
  render();
};
$("#wkCancel").onclick = ()=> wk.close();

/* ================= domains ================= */

/* in-app confirm — native confirm() is silently blocked in embedded panes */
const confirmDlg = $("#confirmDlg");
let cfCb = null;
function askConfirm(title, msg, cb){
  $("#cfTitle").textContent = title;
  $("#cfMsg").textContent = msg;
  cfCb = cb;
  confirmDlg.showModal();
}
$("#cfOk").onclick = ()=>{ confirmDlg.close(); const cb = cfCb; cfCb = null; if (cb) cb(); };
$("#cfCancel").onclick = ()=>{ confirmDlg.close(); cfCb = null; };

const nameDlg = $("#nameDlg");
let nameCb = null;
function askName(title, initial, cb){
  $("#nmTitle").textContent = title;
  $("#nmInput").value = initial;
  nameCb = cb;
  nameDlg.showModal();
  $("#nmInput").focus();
}
$("#nmOk").onclick = ()=>{
  const v = $("#nmInput").value.trim();
  nameDlg.close();
  if (v && nameCb) nameCb(v);
  nameCb = null;
};
$("#nmCancel").onclick = ()=>{ nameDlg.close(); nameCb = null; };
$("#nmInput").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); $("#nmOk").click(); } });

function addDomain(){
  askName("New goal line", "", name=>{
    const d = newDomain(name);
    state.domains.push(d);
    state.activeDomain = d.id;
    save(); render();
  });
}
function renameDomain(d){
  askName("Rename goal line", d.name, name=>{
    d.name = name;
    save(); render();
  });
}

/* ================= wizard ================= */

const wz = $("#wz");
let wzIx = 0, wzVals = [], wzLevels = LEVELS;

$("#btnWizard").onclick = ()=>{
  const dom = activeDomain(); if (!dom) return;
  wzIx = 0;
  wzLevels = levelsFor(dom);
  wzVals = wzLevels.map(l=>dom.levels[l.key].text);
  wzPaint();
  wz.showModal();
};
function wzPaint(){
  const lv = wzLevels[wzIx];
  $("#wzStep").textContent = "Step "+(wzIx+1)+" of "+wzLevels.length+" — "+lv.label;
  $("#wzQ").textContent = wzIx===0 ? TOP_QUESTIONS[lv.key] : lv.q;
  const ctx = $("#wzCtx");
  if (wzIx>0 && wzVals[wzIx-1].trim()){
    ctx.hidden = false;
    $("#wzCtxLbl").textContent = "Based on my "+wzLevels[wzIx-1].label.toLowerCase();
    $("#wzCtxTxt").textContent = wzVals[wzIx-1];
  } else ctx.hidden = true;
  const inp = $("#wzInput");
  inp.value = wzVals[wzIx];
  $("#wzBack").style.visibility = wzIx===0 ? "hidden" : "visible";
  $("#wzNext").textContent = wzIx===wzLevels.length-1 ? "Finish ✓" : "Next →";
  inp.focus();
}
$("#wzBack").onclick = ()=>{ wzVals[wzIx] = $("#wzInput").value; if (wzIx>0){ wzIx--; wzPaint(); } };
$("#wzNext").onclick = ()=>{
  wzVals[wzIx] = $("#wzInput").value;
  if (wzIx < wzLevels.length-1){ wzIx++; wzPaint(); return; }
  const dom = activeDomain();
  let changed = false;
  wzLevels.forEach((l,i)=>{ if (setLevelText(dom, l.key, wzVals[i])) changed = true; });
  wz.close();
  if (changed) render();
};
$("#wzCancel").onclick = ()=> wz.close();

/* ================= export / import / print ================= */

$("#btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Goal Setting to the Now "+todayISO()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("#btnImport").onclick = ()=> $("#fileImport").click();
$("#fileImport").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if (!s || !Array.isArray(s.domains) || !s.domains.length) throw new Error("Not a Goal Setting export.");
      for (const d of s.domains){
        if (!d.levels) throw new Error("Not a Goal Setting export.");
        for (const l of LEVELS) if (!d.levels[l.key]) d.levels[l.key] = { text:"", updated:null };
      }
      if (!Array.isArray(s.history)) s.history = [];
      askConfirm("Import backup",
        "Replace everything in this browser with the imported file? Export first if you want a copy of the current data.",
        ()=>{
          state = withDefaults(s);
          if (!activeDomain()) state.activeDomain = state.domains.find(d=>!d.archived)?.id;
          save(); render();
        });
    }catch(err){ alert("Import failed: "+err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
});
$("#btnPrint").onclick = ()=> window.print();

/* ================= boot ================= */
if (window.GTN_REMOTE){
  $("#main").innerHTML = '<p class="empty-note" style="padding:24px">Loading your goals from the server…</p>';
  window.GTN_REMOTE.init().then(remote=>{
    if (remote) state = withDefaults(remote);
    render();
  }).catch(()=>{
    $("#main").innerHTML = '<p class="empty-note" style="padding:24px">Could not reach the server. Refresh to try again.</p>';
  });
} else {
  render();
}
</script>
</body>
</html>
