<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book</title>
<script>try{var p=parseInt(localStorage.getItem("en-fontsize"));if(p>=80&&p<=180)document.documentElement.style.fontSize=p+"%"}catch(e){}</script>
<link rel="stylesheet" href="/pdf_viewer.css">
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --ink: #1b2433; --mute: #667085; --line: #d9dfeb; --soft: #eef1f8;
    --accent: #2f4bd8; --accent-ink: #ffffff; --accent-soft: #e4e9ff; --desk: #cfc9bb; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151f; --card: #19212f; --ink: #e6ebf5; --mute: #98a5bd; --line: #2b3850; --soft: #212c40;
      --accent: #8199ff; --accent-ink: #0b1230; --accent-soft: #25305a; --desk: #161a22; --danger: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .bk { display: flex; height: calc(100vh - 40px); min-height: 360px; }
  .bk-side { width: 300px; flex: none; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .bk-side[hidden] { display: none; }
  .bk-tabs { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .bk-tabs button { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; font-size: .88rem; }
  .bk-tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bk-pane { flex: 1; overflow: auto; padding: 4px 10px 14px; min-height: 0; }
  .bk-pane[hidden] { display: none; }
  .toc ul { list-style: none; margin: 0; padding-left: 14px; } .toc > ul { padding-left: 0; }
  .toc a { display: block; padding: 4px 6px; border-radius: 6px; color: var(--ink); text-decoration: none; cursor: pointer; font-size: .9rem; }
  .toc a:hover { background: var(--accent-soft); }
  .none { color: var(--mute); padding: 12px 4px; font-size: .9rem; }
  .sr { display: block; width: 100%; text-align: left; padding: 6px 8px; margin-top: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; cursor: pointer; }
  .sr:hover { border-color: var(--accent); }
  .sr b { color: var(--accent); margin-right: 6px; } .sr small { color: var(--mute); display: block; }
  .sr mark { background: #ffe58a; color: inherit; border-radius: 2px; }

  .bk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bk-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
  .bk-bar .grp { display: inline-flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  .bk-bar .grp:last-child { border-right: 0; }
  .btn { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--accent); } .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .bk-bar select, .bk-bar input[type=search] { height: 34px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 0 8px; min-width: 0; }
  .bk-bar select { max-width: 280px; }
  #pgIn { width: 58px; text-align: center; height: 34px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; }
  .of { color: var(--mute); font-size: .9rem; white-space: nowrap; }
  #slider { width: 100%; margin: 0; height: 14px; accent-color: var(--accent); }
  .bk-slide { padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--line); }

  .bk-stage { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--desk); display: flex; padding: 18px 56px; }
  .bk-spread { margin: auto; display: flex; align-items: flex-start; justify-content: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.28); background: #fff; transition: opacity .12s ease; }
  .bk-spread.flip { opacity: .0; }
  .pg { position: relative; background: #fff; flex: none; }
  .pg canvas { display: block; }
  .pg.left { box-shadow: inset -14px 0 18px -14px rgba(0,0,0,.35); } .pg.right { box-shadow: inset 14px 0 18px -14px rgba(0,0,0,.35); }
  .pg .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1; }
  .pg .textLayer span.hit { background: rgba(255, 214, 0, .45); border-radius: 2px; color: transparent; }
  .pg .textLayer ::selection { background: rgba(47, 75, 216, .35); }
  .nav { position: absolute; top: 0; bottom: 0; width: 52px; border: 0; background: transparent; cursor: pointer; font-size: 2rem; color: rgba(255,255,255,.0); z-index: 5; }
  .bk-stage:hover .nav { color: rgba(40,40,40,.45); } .nav:hover { background: rgba(0,0,0,.06); color: rgba(20,20,20,.8) !important; }
  .nav.prev { left: 0; } .nav.next { right: 0; } .nav:disabled { visibility: hidden; }
  .msg { margin: auto; max-width: 560px; text-align: center; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; }
  .msg code { background: var(--soft); padding: 1px 6px; border-radius: 5px; word-break: break-all; }
  .bk-foot { padding: 4px 12px; font-size: .78rem; color: var(--mute); background: var(--card); border-top: 1px solid var(--line); min-height: 24px; }
  .pop { position: fixed; z-index: 50; background: #1b2542; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); border: 0; }
  .pop[hidden] { display: none; }
  @media (max-width: 760px) { .bk-side { position: absolute; z-index: 20; height: calc(100% - 0px); } .bk-stage { padding: 10px 40px; } }
  :fullscreen .bk { height: 100vh; }
</style>
</head>
<body>
<div class="bk" id="bk">
  <aside class="bk-side" id="side" hidden>
    <div class="bk-tabs"><button type="button" class="on" data-p="toc" id="tTab">Contents</button><button type="button" data-p="find" id="fTab">Search</button></div>
    <div class="bk-pane toc" id="toc"></div>
    <div class="bk-pane" id="find" hidden>
      <div class="row" style="display:flex;gap:6px;margin:4px 0 6px"><input type="search" id="q" placeholder="Search the book…" style="flex:1;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 8px" aria-label="Search the book"><button class="btn" id="qGo" type="button">Go</button></div>
      <div class="none" id="qStatus"></div><div id="qRes"></div>
    </div>
  </aside>
  <section class="bk-main">
    <div class="bk-bar">
      <div class="grp"><button class="btn" id="sideBtn" type="button" title="Contents and search">☰</button><select id="bookSel" aria-label="Book"></select></div>
      <div class="grp"><button class="btn" id="prev" type="button" title="Previous page (←)">◀</button><input id="pgIn" type="text" inputmode="numeric" aria-label="Page"><span class="of" id="of"></span><button class="btn" id="next" type="button" title="Next page (→)">▶</button></div>
      <div class="grp"><button class="btn on" id="mBook" type="button" title="Two pages side by side, like an open book">📖 Book</button><button class="btn" id="mOne" type="button" title="One page at a time">▯ Page</button></div>
      <div class="grp"><button class="btn on" id="fPage" type="button" title="Fit the whole page on screen">Fit page</button><button class="btn" id="fWidth" type="button" title="Fit the width, scroll down">Fit width</button><button class="btn" id="zOut" type="button" title="Zoom out (−)">−</button><button class="btn" id="zIn" type="button" title="Zoom in (+)">+</button></div>
      <div class="grp"><button class="btn" id="fs" type="button" title="Full screen (F)">⛶</button></div>
    </div>
    <div class="bk-slide"><input type="range" id="slider" min="1" value="1" aria-label="Page slider"></div>
    <div class="bk-stage" id="stage">
      <button class="nav prev" id="navPrev" type="button" aria-label="Previous page">‹</button>
      <div class="bk-spread" id="spread"></div>
      <button class="nav next" id="navNext" type="button" aria-label="Next page">›</button>
    </div>
    <div class="bk-foot" id="foot">Loading…</div>
  </section>
</div>
<button class="pop" id="pop" type="button" hidden>🔊 Hear it</button>
<script src="/pdf.min.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "fr-book";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var norm = function (s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  var nice = function (n) { return n.replace(/\.pdf$/i, "").replace(/[_]+/g, " "); };
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdf.worker.min.js";

  var lib = { dir: "", books: [] }, memo = { last: "", files: {} };
  var pdf = null, N = 0, name = "", page = 1, mode = "book", fit = "page", zoom = 1, renderTok = 0, tasks = [], query = "";
  var pageCache = {}, saveT = 0;

  function save() { clearTimeout(saveT); saveT = setTimeout(function () { memo.last = name; memo.files[name] = { page: page, mode: mode, fit: fit }; Store.save(KEY, memo); }, 600); }

  /* ---------- opening a book ---------- */
  function openBook(file) {
    name = file; pageCache = {}; pdf = null; N = 0; query = ""; $("qRes").innerHTML = ""; $("qStatus").textContent = ""; index = null;
    $("foot").textContent = "Opening " + nice(file) + "…"; $("spread").innerHTML = ""; $("toc").innerHTML = '<div class="none">Loading contents…</div>';
    var task = pdfjsLib.getDocument({ url: "/books/" + encodeURIComponent(file), withCredentials: true, disableAutoFetch: true, disableStream: true, rangeChunkSize: 524288 });   // only fetch the parts of the file you actually look at
    task.onProgress = function (p) { if (p.total) $("foot").textContent = "Opening " + nice(file) + "… " + Math.round(100 * p.loaded / p.total) + "%"; };
    task.promise.then(function (doc) {
      pdf = doc; N = doc.numPages; var m = memo.files[file] || {};
      mode = m.mode || "book"; fit = m.fit || "page"; zoom = 1; page = Math.min(Math.max(1, m.page || 1), N);
      $("slider").max = N; $("pgIn").disabled = false; syncButtons();
      show(page, true); buildToc(); memo.last = file; save();
    }, function (e) { fail("This PDF could not be opened (" + (e && e.message || e) + ")."); });
  }
  function fail(msg) { $("spread").innerHTML = ""; $("spread").style.boxShadow = "none"; $("spread").innerHTML = '<div class="msg">' + esc(msg) + "</div>"; $("foot").textContent = ""; }

  /* ---------- page layout: a book has the cover alone, then pairs (2-3, 4-5, …) ---------- */
  function twoUp() { return mode === "book" && $("stage").clientWidth >= 720; }     // a narrow screen shows one page at a time
  function pagesFor(p) {
    if (!twoUp()) return [p];
    if (p === 1) return [1];
    var l = p % 2 === 0 ? p : p - 1; return l + 1 <= N ? [l, l + 1] : [l];
  }
  function stepFrom(p, dir) {
    var cur = pagesFor(p), edge = dir > 0 ? cur[cur.length - 1] : cur[0], t = edge + dir;
    return Math.min(N, Math.max(1, t));
  }
  function getPage(i) { return pageCache[i] || (pageCache[i] = pdf.getPage(i)); }

  function show(p, instant) {
    if (!pdf) return;
    p = Math.min(N, Math.max(1, p)); page = pagesFor(p)[0];
    var my = ++renderTok; tasks.forEach(function (t) { try { t.cancel(); } catch (e) {} }); tasks = [];
    var list = pagesFor(page), stage = $("stage");
    var availW = stage.clientWidth - (parseFloat(getComputedStyle(stage).paddingLeft) + parseFloat(getComputedStyle(stage).paddingRight));
    var availH = stage.clientHeight - (parseFloat(getComputedStyle(stage).paddingTop) + parseFloat(getComputedStyle(stage).paddingBottom));
    Promise.all(list.map(getPage)).then(function (pgs) {
      if (my !== renderTok) return;
      var base = pgs.map(function (pg) { return pg.getViewport({ scale: 1 }); });
      var totalW = base.reduce(function (n, v) { return n + v.width; }, 0), maxH = Math.max.apply(null, base.map(function (v) { return v.height; }));
      var s = fit === "width" ? availW / totalW : Math.min(availW / totalW, availH / maxH);
      s = Math.max(0.2, s * zoom);
      var sp = $("spread"); sp.style.boxShadow = ""; sp.classList.add("flip");
      var out = pgs.map(function (pg, k) {
        var vp = pg.getViewport({ scale: s }), el = document.createElement("div");
        el.className = "pg" + (list.length === 2 ? (k === 0 ? " left" : " right") : "");
        el.style.width = Math.floor(vp.width) + "px"; el.style.height = Math.floor(vp.height) + "px";
        var cv = document.createElement("canvas"), ratio = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.floor(vp.width * ratio); cv.height = Math.floor(vp.height * ratio); cv.style.width = Math.floor(vp.width) + "px"; cv.style.height = Math.floor(vp.height) + "px";
        el.appendChild(cv);
        var tl = document.createElement("div"); tl.className = "textLayer"; tl.style.setProperty("--scale-factor", vp.scale); el.appendChild(tl);
        return { pg: pg, vp: vp, el: el, cv: cv, tl: tl, ratio: ratio };
      });
      sp.innerHTML = ""; out.forEach(function (o) { sp.appendChild(o.el); });
      requestAnimationFrame(function () { sp.classList.remove("flip"); });
      stage.scrollTop = 0;
      updateChrome();
      out.forEach(function (o) {
        var t = o.pg.render({ canvasContext: o.cv.getContext("2d"), viewport: o.vp, transform: o.ratio !== 1 ? [o.ratio, 0, 0, o.ratio, 0, 0] : null });
        tasks.push(t);
        t.promise.then(function () {
          if (my !== renderTok) return;
          return o.pg.getTextContent().then(function (tc) {
            if (my !== renderTok) return;
            var r = pdfjsLib.renderTextLayer({ textContentSource: tc, container: o.tl, viewport: o.vp, textDivs: [] });
            return r.promise.then(function () { markHits(o.tl); });
          });
        }).catch(function () {});
      });
      // warm the next spread
      var nx = stepFrom(page, 1); if (nx !== page) pagesFor(nx).forEach(getPage);
      $("foot").textContent = nice(name) + (query ? "  ·  highlighting “" + query + "”" : "");
      save();
    });
  }
  function markHits(tl) {
    if (!query) return; var q = norm(query);
    tl.querySelectorAll("span").forEach(function (sp) { if (norm(sp.textContent).indexOf(q) >= 0) sp.classList.add("hit"); });
  }
  function updateChrome() {
    var list = pagesFor(page);
    $("pgIn").value = list.length === 2 ? list[0] + "–" + list[1] : String(list[0]);
    $("of").textContent = "/ " + N; $("slider").value = list[0];
    $("prev").disabled = $("navPrev").disabled = list[0] <= 1; $("next").disabled = $("navNext").disabled = list[list.length - 1] >= N;
  }
  function syncButtons() {
    $("mBook").classList.toggle("on", mode === "book"); $("mOne").classList.toggle("on", mode === "single");
    $("fPage").classList.toggle("on", fit === "page"); $("fWidth").classList.toggle("on", fit === "width");
  }
  function go(p) { show(p); }
  function flip(dir) { show(stepFrom(page, dir)); }

  /* ---------- contents ---------- */
  function buildToc() {
    pdf.getOutline().then(function (ol) {
      var box = $("toc");
      if (!ol || !ol.length) { box.innerHTML = '<div class="none">This PDF has no table of contents. Use the slider, the page box, or the Search tab.</div>'; return; }
      function build(items) {
        var ul = document.createElement("ul");
        items.forEach(function (it) {
          var li = document.createElement("li"), a = document.createElement("a"); a.textContent = it.title || "(untitled)";
          a.onclick = function () { dest(it.dest); }; li.appendChild(a);
          if (it.items && it.items.length) li.appendChild(build(it.items)); ul.appendChild(li);
        }); return ul;
      }
      box.innerHTML = ""; box.appendChild(build(ol));
    }, function () { $("toc").innerHTML = '<div class="none">No table of contents.</div>'; });
  }
  function dest(d) {
    if (!d) return;
    (typeof d === "string" ? pdf.getDestination(d) : Promise.resolve(d)).then(function (arr) {
      if (!Array.isArray(arr)) return;
      var ref = arr[0]; return typeof ref === "object" ? pdf.getPageIndex(ref).then(function (i) { go(i + 1); }) : go(ref + 1);
    });
  }

  /* ---------- search (reads every page's text once, then finds instantly) ---------- */
  var index = null, indexing = false;
  function buildIndex(done) {
    if (index) return done(); if (indexing) return;
    indexing = true; index = []; var i = 1;
    (function step() {
      if (i > N) { indexing = false; return done(); }
      $("qStatus").textContent = "Reading the book… " + i + " / " + N;
      pdf.getPage(i).then(function (pg) { return pg.getTextContent(); }).then(function (tc) {
        var txt = tc.items.map(function (x) { return x.str; }).join(" "); index.push({ p: i, t: txt, n: norm(txt) });
        i++; if (i % 8 === 0) setTimeout(step, 0); else step();
      }, function () { index.push({ p: i, t: "", n: "" }); i++; step(); });
    })();
  }
  function search() {
    var q = $("q").value.trim(); if (!pdf) return; query = q;
    if (!q) { $("qRes").innerHTML = ""; $("qStatus").textContent = ""; show(page); return; }
    buildIndex(function () {
      var nq = norm(q), hits = index.filter(function (e) { return e.n.indexOf(nq) >= 0; });
      $("qStatus").textContent = hits.length ? hits.length + " page" + (hits.length === 1 ? "" : "s") + " with “" + q + "”" : "Nothing found for “" + q + "”.";
      $("qRes").innerHTML = hits.slice(0, 300).map(function (e) {
        var at = e.n.indexOf(nq), a = Math.max(0, at - 28), snip = e.t.slice(a, at + nq.length + 40);
        var lo = Math.max(0, at - a); var s = esc(snip.slice(0, lo)) + "<mark>" + esc(snip.slice(lo, lo + nq.length)) + "</mark>" + esc(snip.slice(lo + nq.length));
        return '<button class="sr" data-p="' + e.p + '"><b>p. ' + e.p + "</b>" + (a > 0 ? "… " : "") + s + "</button>";
      }).join("");
      show(page);       // re-draw the current spread with the matches marked
    });
  }
  $("qGo").onclick = search; $("q").onkeydown = function (e) { if (e.key === "Enter") search(); };
  $("qRes").addEventListener("click", function (e) { var b = e.target.closest(".sr"); if (b) go(+b.dataset.p); });

  /* ---------- controls ---------- */
  $("prev").onclick = $("navPrev").onclick = function () { flip(-1); };
  $("next").onclick = $("navNext").onclick = function () { flip(1); };
  $("slider").oninput = function () { go(+this.value); };
  $("pgIn").onkeydown = function (e) { if (e.key === "Enter") { var n = parseInt(this.value, 10); if (n >= 1) go(n); this.blur(); } };
  $("pgIn").onfocus = function () { this.select(); };
  $("mBook").onclick = function () { mode = "book"; syncButtons(); show(page); };
  $("mOne").onclick = function () { mode = "single"; syncButtons(); show(page); };
  $("fPage").onclick = function () { fit = "page"; zoom = 1; syncButtons(); show(page); };
  $("fWidth").onclick = function () { fit = "width"; zoom = 1; syncButtons(); show(page); };
  $("zIn").onclick = function () { zoom = Math.min(4, zoom * 1.2); show(page); };
  $("zOut").onclick = function () { zoom = Math.max(0.4, zoom / 1.2); show(page); };
  $("fs").onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
  $("sideBtn").onclick = function () { var s = $("side"); s.hidden = !s.hidden; setTimeout(function () { show(page); }, 30); };
  $("tTab").onclick = $("fTab").onclick = function () {
    var f = this.dataset.p === "find"; $("toc").hidden = f; $("find").hidden = !f; $("tTab").classList.toggle("on", !f); $("fTab").classList.toggle("on", f); if (f) $("q").focus();
  };
  $("bookSel").onchange = function () { openBook(this.value); };
  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || "") || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey)) { e.preventDefault(); flip(1); }
    else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault(); flip(-1); }
    else if (k === "Home") { e.preventDefault(); go(1); } else if (k === "End") { e.preventDefault(); go(N); }
    else if (k === "+" || k === "=") $("zIn").onclick(); else if (k === "-") $("zOut").onclick();
    else if (k === "f" || k === "F") $("fs").onclick(); else if (k === "/") { e.preventDefault(); $("side").hidden = false; $("fTab").onclick(); }
  });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (pdf) show(page); }, 200); });

  /* ---------- select a word or phrase -> hear it in French ---------- */
  var pop = $("pop"), picked = "";
  function speak(t) {
    if (!("speechSynthesis" in window) || !t) return; speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.lang = "fr-FR"; u.rate = 0.85;
    var v = speechSynthesis.getVoices().filter(function (x) { return /^fr/i.test(x.lang); })[0]; if (v) u.voice = v; speechSynthesis.speak(u);
  }
  function checkSel() {
    var sel = window.getSelection(), t = sel ? sel.toString().trim() : "";
    var inside = sel && sel.rangeCount && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest(".textLayer");
    if (!t || !inside || t.length > 300) { pop.hidden = true; return; }
    picked = t.replace(/\s+/g, " "); var r = sel.getRangeAt(0).getBoundingClientRect();
    pop.hidden = false; pop.style.left = Math.max(8, Math.min(innerWidth - 110, r.left + r.width / 2 - 45)) + "px"; pop.style.top = Math.max(48, r.top - 40) + "px";
  }
  document.addEventListener("mouseup", function () { setTimeout(checkSel, 10); });
  document.addEventListener("touchend", function () { setTimeout(checkSel, 300); });
  pop.addEventListener("mousedown", function (e) { e.preventDefault(); });
  pop.onclick = function () { speak(picked); };

  /* ---------- start ---------- */
  Promise.all([Store.load(KEY, { last: "", files: {} }, null), fetch("/api/books", { credentials: "same-origin" }).then(function (r) { return r.json(); })]).then(function (r) {
    memo = r[0] && r[0].files ? r[0] : { last: "", files: {} }; lib = r[1];
    var sel = $("bookSel");
    if (!lib.books.length) {
      sel.style.display = "none"; $("spread").style.boxShadow = "none";
      $("spread").innerHTML = '<div class="msg"><h2 style="margin:0 0 8px">No book found yet</h2><p>Put a PDF in this folder, then reload the page:</p><p><code>' + esc(lib.dir) + '</code></p><p style="color:var(--mute);font-size:.9rem">Any PDF there shows up here, and the page you stopped at is remembered for each one.</p></div>';
      $("foot").textContent = ""; $("pgIn").disabled = true; return;
    }
    sel.innerHTML = lib.books.map(function (b) { return '<option value="' + esc(b.name) + '">' + esc(nice(b.name)) + " (" + (b.size / 1048576 >= 1 ? (b.size / 1048576).toFixed(0) + " MB" : Math.round(b.size / 1024) + " KB") + ")</option>"; }).join("");
    if (lib.books.length === 1) sel.disabled = true;
    var first = lib.books.some(function (b) { return b.name === memo.last; }) ? memo.last : lib.books[0].name;
    sel.value = first; openBook(first);
  }).catch(function (e) { fail("Could not load the book list (" + (e && e.message || e) + ")."); });
})();
</script>
</body>
</html>
